# Tilt-to-keys configuration. Every value shown is the default.
# Use with:  python -m backend.tilt_keys.run --config backend/tilt_keys/tilt_keys.example.toml
# or set TILT_KEYS_CONFIG=/path/to/file.toml

# Hysteresis, degrees past neutral (after calibration, inversion, filtering).
on_threshold_deg = 15.0     # press when angle > this
off_threshold_deg = 10.0    # release only when angle < this

# Flip an axis if the vision agent's camera sees it mirrored.
invert_forward = false
invert_right = false

# One Euro filter. Lower min_cutoff = less jitter but more lag at rest.
# Higher beta = less lag during fast tilts.
filter_enabled = true
filter_min_cutoff_hz = 1.0
filter_beta = 0.05
filter_d_cutoff_hz = 1.0

# Safety: release ALL keys if no tilt_update for this long.
stale_timeout_ms = 200
watchdog_period_ms = 20

# Neutral calibration. 0 duration disables calibration (offset = 0).
calibration_duration_ms = 2000
calibration_min_samples = 10
calibration_min_valid_fraction = 0.8
calibration_max_std_deg = 1.5
calibration_max_range_deg = 5.0

# Key names: single characters, or pynput Key names like "up", "space", "shift".
[keys]
forward = "w"
back = "s"
left = "a"
right = "d"
