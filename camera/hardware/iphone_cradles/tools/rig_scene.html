<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#eef1f5}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script></head><body>
<script type="module">
import * as THREE from 'three';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
const W = 1600, H = 1000;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xeef1f5);
THREE.Object3D.DEFAULT_UP.set(0, 0, 1);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(1.5, -1.2, 3); sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096); Object.assign(sun.shadow.camera, { left: -2, right: 2, top: 2, bottom: -2, near: 0.1, far: 8 });
scene.add(sun);
const mat = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.6, metalness: 0.05, ...o });
function box(sx, sy, sz, color, x, y, z, parent = scene) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), mat(color)); m.position.set(x, y, z);
  m.castShadow = m.receiveShadow = true; parent.add(m); return m;
}
function rod(a, b, r, color) {
  const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b), d = B.clone().sub(A);
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, d.length(), 20), mat(color, { metalness: 0.6, roughness: 0.35 }));
  m.position.copy(A).add(B).multiplyScalar(0.5); m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
  m.castShadow = true; scene.add(m); return m;
}
function label(text, x, y, z, color = '#1d2b3a', size = 0.07) {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 256; const g = c.getContext('2d');
  g.fillStyle = 'rgba(255,255,255,0.88)'; g.beginPath(); g.roundRect(8, 8, 1008, 240, 40); g.fill();
  g.fillStyle = color; g.font = 'bold 92px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  const lines = text.split('\n'); lines.forEach((l, i) => g.fillText(l, 512, 128 + (i - (lines.length - 1) / 2) * 100, 980));
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false }));
  s.scale.set(size * 4, size, 1); s.position.set(x, y, z); s.renderOrder = 10; scene.add(s); return s;
}

// Table (top surface at z = 0) and floor
box(1.3, 0.9, 0.04, 0xc8a27a, 0, 0, -0.02);
for (const [x, y] of [[-0.6, -0.4], [0.6, -0.4], [-0.6, 0.4], [0.6, 0.4]]) box(0.05, 0.05, 0.71, 0x6b4f36, x, y, -0.395);
const floor = box(5, 5, 0.01, 0xd9dde3, 0, 0, -0.755);
// Work area, world axes, tracked object (a mug) and its generic sphere marker
const area = new THREE.Mesh(new THREE.CircleGeometry(0.25, 64), new THREE.MeshBasicMaterial({ color: 0xf39c12, transparent: true, opacity: 0.18 }));
area.position.z = 0.001; scene.add(area);
const mug = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.036, 0.1, 40), mat(0x2e86de)); mug.rotation.x = Math.PI / 2; mug.position.set(0.05, 0.03, 0.05); mug.castShadow = true; scene.add(mug);
const handle = new THREE.Mesh(new THREE.TorusGeometry(0.028, 0.008, 12, 30), mat(0x2e86de)); handle.position.set(0.095, 0.03, 0.05); handle.rotation.x = Math.PI / 2; scene.add(handle);
for (const [d, c] of [[[0.12, 0, 0], 0xe74c3c], [[0, 0.12, 0], 0x27ae60], [[0, 0, 0.12], 0x2980b9]]) rod([-0.45, -0.3, 0.002], [-0.45 + d[0], -0.3 + d[1], 0.002 + d[2]], 0.004, c);
label('world origin\n+X red  +Y green  +Z blue', -0.42, -0.3, 0.2, '#1d2b3a', 0.075);
// Checkerboard (environment-only calibration target, removed after calibration)
const cb = new THREE.Group(); for (let i = 0; i < 9; i++) for (let j = 0; j < 6; j++) box(0.025, 0.025, 0.002, (i + j) % 2 ? 0x111111 : 0xffffff, i * 0.025, j * 0.025, 0.001, cb);
cb.position.set(0.28, -0.35, 0); scene.add(cb);

// Phone in cradle, built in the mount frame (mm), then posed in the world.
const loader = new STLLoader();
const load = f => new Promise(r => loader.load(f, r));
const PH = { iphone_14_pro_max: [160.7, 77.6, 7.85], iphone_16_pro: [149.6, 71.5, 8.25] };
async function rig(model, color) {
  const [h, w, d] = PH[model], C = 0.4;
  const g = new THREE.Group();
  const cradle = new THREE.Mesh(await load(`cradle_${model}.stl`), mat(0x1e1e22, { roughness: 0.8 })); cradle.castShadow = true; g.add(cradle);
  const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(color, { metalness: 0.5, roughness: 0.3 })); body.position.set(C + w / 2, C + h / 2, d / 2); body.castShadow = true; g.add(body);
  const screen = new THREE.Mesh(new THREE.PlaneGeometry(w - 4, h - 4), new THREE.MeshBasicMaterial({ color: 0x0d1b2a })); screen.position.set(C + w / 2, C + h / 2, d + 0.05); g.add(screen);
  const bx = C + w - 5 - 19, by = C + h - 5 - 19;
  const bump = new THREE.Mesh(new THREE.BoxGeometry(38, 38, 4), mat(color, { metalness: 0.5, roughness: 0.3 })); bump.position.set(bx, by, -2); g.add(bump);
  for (const [dx, dy] of [[-8, 8], [-8, -8], [8, 0]]) {
    const lens = new THREE.Mesh(new THREE.CylinderGeometry(7, 7, 3, 32), mat(0x050505, { metalness: 0.9, roughness: 0.1 }));
    lens.rotation.x = Math.PI / 2; lens.position.set(bx + dx, by + dy, -5); g.add(lens);
  }
  g.children.forEach(c => c.position.sub(new THREE.Vector3(C + w / 2, C + h / 2, 0)));
  g.scale.setScalar(0.001);
  const outer = new THREE.Group(); outer.add(g); scene.add(outer);
  return { outer, w, h };
}
// Point the rear camera (mount -Z) at target, phone in landscape (mount +Y horizontal).
function pose(o, pos, target, upHint) {
  o.position.set(...pos);
  const P = new THREE.Vector3(...pos), T = new THREE.Vector3(...target);
  const dir = T.clone().sub(P).normalize();
  o.up.copy(upHint ?? new THREE.Vector3(0, 0, 1).cross(dir).normalize());
  o.lookAt(P.clone().sub(dir));
}
function frustum(pos, target, len, color) {
  const P = new THREE.Vector3(...pos), T = new THREE.Vector3(...target), dir = T.clone().sub(P).normalize();
  const right = new THREE.Vector3(0, 0, 1).cross(dir); if (right.length() < 1e-3) right.set(1, 0, 0); right.normalize();
  const up = dir.clone().cross(right).normalize(); const hw = Math.tan(0.6) * len, hh = hw * 9 / 16;
  const pts = [];
  const corners = [[1, 1], [1, -1], [-1, -1], [-1, 1]].map(([a, b]) => P.clone().addScaledVector(dir, len).addScaledVector(right, a * hw).addScaledVector(up, b * hh));
  corners.forEach((c, i) => { pts.push(P, c, c, corners[(i + 1) % 4]); });
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  scene.add(new THREE.LineSegments(geo, new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.55 })));
}
function tripod(top, color = 0x333333) {
  const [x, y, z] = top; rod([x, y, z - 0.03], [x, y, -0.35], 0.01, color);
  for (let k = 0; k < 3; k++) { const a = k * 2.094 + 0.4; rod([x, y, -0.35], [x + 0.28 * Math.cos(a), y + 0.28 * Math.sin(a), -0.75], 0.008, color); }
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.018, 24, 16), mat(0x222222, { metalness: 0.6 })); head.position.set(x, y, z - 0.03); scene.add(head);
}

const target = [0, 0, 0.04];
// cam_1: iPhone 16 Pro overhead, hanging from a boom by its edge mount
const c1 = await rig('iphone_16_pro', 0x8a8f98);
const p1 = [0, 0, 1.0]; pose(c1.outer, p1, [0, 0, 0], new THREE.Vector3(1, 0, 0));
const edgeY = (c1.w / 2 + 0.4 + 2.6 + 12) / 1000, edgeX = (150.4 * 0.30 + 14 - 75.2) / 1000;
rod([edgeX, edgeY, 1.0], [edgeX, 0.85, 1.0], 0.012, 0x555555);           // boom
rod([edgeX, 0.85, 1.0], [edgeX, 0.85, -0.75], 0.016, 0x555555);           // C-stand pole
for (let k = 0; k < 3; k++) { const a = k * 2.094; rod([edgeX, 0.85, -0.6], [edgeX + 0.3 * Math.cos(a), 0.85 + 0.3 * Math.sin(a), -0.75], 0.01, 0x555555); }
frustum(p1, [0, 0, 0], 0.95, 0xe67e22);
label('cam_1  iPhone 16 Pro\noverhead ~1.0 m, looking down', 0.0, 0.33, 1.12, '#b35900');
// cam_2 / cam_3: iPhone 14 Pro Max on tripods, ~35 deg elevation, 110 deg apart
const cams = [['cam_2', -90], ['cam_3', 20]];
for (const [id, az] of cams) {
  const a = az * Math.PI / 180, r = 0.75, p = [r * Math.cos(a), r * Math.sin(a), 0.5];
  const c = await rig('iphone_14_pro_max', 0x6b5b95); pose(c.outer, p, target); tripod(p);
  frustum(p, target, 0.8, 0x6b5b95);
  label(`${id}  iPhone 14 Pro Max\ntripod, ~35° elevation`, p[0] * 1.15, p[1] * 1.15, p[2] + 0.17, '#4a3b75');
}
label('object (mug) → tracked as a sphere in the viewer', 0.05, 0.03, 0.26, '#1f5f9e', 0.075);
label('checkerboard: calibration only, then removed', 0.42, -0.42, 0.1, '#333', 0.07);

window.shoot = (pos, look, fov = 40) => {
  const cam = new THREE.PerspectiveCamera(fov, W / H, 0.01, 20); cam.up.set(0, 0, 1);
  cam.position.set(...pos); cam.lookAt(...look); renderer.render(scene, cam);
};
window.ready = true;
</script></body></html>
